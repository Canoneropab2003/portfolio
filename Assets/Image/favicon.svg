<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1c33"/>
      <stop offset="55%" stop-color="#123a5e"/>
      <stop offset="100%" stop-color="#0e2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd873"/>
      <stop offset="100%" stop-color="#e8a83c"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#d7dfe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2f6ea8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f6ea8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Chip-shaped hexagon body (Computer Engineering motif) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17"
           fill="url(#bg)" stroke="#3a6a99" stroke-width="1"/>
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17"
           fill="url(#glow)"/>

  <!-- Chip pins along the edges -->
  <g stroke="#5b93c4" stroke-width="1.6" stroke-linecap="round">
    <line x1="0" y1="14" x2="6" y2="14"/>
    <line x1="0" y1="32" x2="6" y2="32"/>
    <line x1="0" y1="50" x2="6" y2="50"/>
    <line x1="58" y1="14" x2="64" y2="14"/>
    <line x1="58" y1="32" x2="64" y2="32"/>
    <line x1="58" y1="50" x2="64" y2="50"/>
  </g>
  <g fill="#8fc3ec">
    <circle cx="6" cy="14" r="1.5"/>
    <circle cx="6" cy="32" r="1.5"/>
    <circle cx="6" cy="50" r="1.5"/>
    <circle cx="58" cy="14" r="1.5"/>
    <circle cx="58" cy="32" r="1.5"/>
    <circle cx="58" cy="50" r="1.5"/>
  </g>

  <!-- fine circuit tracery inside the chip, tucked in the corners -->
  <g stroke="#3d6ea5" stroke-width="1" fill="none" opacity="0.55">
    <path d="M11 20 h6 v-5"/>
    <path d="M53 20 h-6 v-5"/>
    <circle cx="11" cy="20" r="1.1" fill="#3d6ea5" stroke="none"/>
    <circle cx="53" cy="20" r="1.1" fill="#3d6ea5" stroke="none"/>
  </g>

  <!-- Graduation cap, centered -->
  <g transform="translate(32,25)">
    <!-- soft shadow -->
    <ellipse cx="0" cy="13.5" rx="11" ry="2.1" fill="#04101f" opacity="0.35"/>

    <!-- cap board (diamond) -->
    <polygon points="0,-11 17,-3.2 0,4.6 -17,-3.2" fill="url(#capTop)"/>
    <polygon points="0,-11 17,-3.2 0,-1.6 -17,-3.2" fill="#ffffff" opacity="0.35"/>

    <!-- cap base / head band -->
    <path d="M-9.5,-0.4 L0,4.2 L9.5,-0.4 L9.5,5.6 C9.5,9.6 5.2,12.4 0,12.4 C-5.2,12.4 -9.5,9.6 -9.5,5.6 Z" fill="#1b2b3e"/>
    <path d="M-9.5,-0.4 L0,4.2 L9.5,-0.4 L9.5,1.6 L0,6.2 L-9.5,1.6 Z" fill="#2c435e"/>

    <!-- button + tassel -->
    <circle cx="0" cy="-3.2" r="1.6" fill="url(#gold)"/>
    <path d="M15,-4.4 C18.5,-2 19.5,2 18.5,10" stroke="url(#gold)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M18.5,10 l-2.4,3.6 M18.5,10 l1,4.2 M18.5,10 l3,2.4" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Monogram -->
  <text x="32" y="53.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5"
        font-weight="700" fill="#eaf3ff" text-anchor="middle" letter-spacing="2">PJ</text>
</svg>
