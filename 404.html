<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This viewport tag is what makes the CSS media queries work on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        /* Reset margins and hide scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container for the 3D canvas */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* The text overlay */
        #text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            color: #ffffff;
            pointer-events: none; /* Lets mouse clicks pass through to the 3D canvas */
            width: 90%; /* Keeps text from touching the edges on mobile */
            max-width: 800px;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            letter-spacing: 5px;
            line-height: 1; /* Keeps the text block tight */
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.6);
            transition: font-size 0.3s ease; /* Smooth transition when resizing */
        }

        p {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #b0c4de;
            line-height: 1.4;
            transition: font-size 0.3s ease;
        }

        /* The return button */
        .home-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 2px solid #00c8ff;
            color: #00c8ff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            pointer-events: auto; /* Makes the button clickable */
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background-color: #00c8ff;
            color: #050510;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.8);
        }

        /* =========================================
           RESPONSIVE DESIGN (Media Queries)
           ========================================= */

        /* Tablets and small laptops */
        @media (max-width: 1024px) {
            h1 {
                font-size: 6rem;
            }
            p {
                font-size: 1.3rem;
            }
        }

        /* Large mobile phones and portrait tablets */
        @media (max-width: 768px) {
            h1 {
                font-size: 4.5rem;
                letter-spacing: 2px;
            }
            p {
                font-size: 1.1rem;
            }
            .home-btn {
                font-size: 1rem;
                padding: 10px 25px;
                margin-top: 20px;
            }
        }

        /* Standard mobile phones */
        @media (max-width: 480px) {
            h1 {
                font-size: 3.5rem;
                letter-spacing: 0px;
            }
            p {
                font-size: 1rem;
            }
            .home-btn {
                font-size: 0.9rem;
                padding: 8px 20px;
            }
        }

        /* Ultra-small screens (e.g., older phones, foldables) */
        @media (max-width: 350px) {
            h1 {
                font-size: 2.8rem;
            }
            p {
                font-size: 0.9rem;
            }
            .home-btn {
                font-size: 0.8rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Background -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div id="text-overlay">
        <h1>404</h1>
        <p>You have drifted into uncharted space.</p>
        <a href="/" class="home-btn">Return to Base</a>
    </div>

    <!-- Import Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        // Add a slight fog to make things fade in the distance
        scene.fog = new THREE.FogExp2(0x050510, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60; // Pull camera back so we can see the shape

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimizes performance on mobile
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        // 2. Create the central "Anomaly" (A rotating Torus Knot)
        const geometry = new THREE.TorusKnotGeometry(12, 3, 100, 16);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00c8ff, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const anomaly = new THREE.Mesh(geometry, material);
        scene.add(anomaly);

        // 3. Create Background Star Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles over a large area
            posArray[i] = (Math.random() - 0.5) * 800; 
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 1.5,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        
        const starField = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(starField);

        // 4. Mouse & Touch Interaction (Parallax Effect)
        let mouseX = 0;
        let mouseY = 0;

        // For Desktop (Mouse)
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        // For Mobile/Tablet (Touch)
        document.addEventListener('touchmove', (event) => {
            if(event.touches.length > 0) {
                mouseX = (event.touches[0].clientX / window.innerWidth) - 0.5;
                mouseY = (event.touches[0].clientY / window.innerHeight) - 0.5;
            }
        }, { passive: true });

        // 5. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate the central anomaly
            anomaly.rotation.y = elapsedTime * 0.2;
            anomaly.rotation.x = elapsedTime * 0.1;

            // Slowly rotate the star field
            starField.rotation.y = elapsedTime * 0.05;
            starField.rotation.x = elapsedTime * 0.02;

            // Subtle camera movement based on mouse/touch position
            camera.position.x += (mouseX * 20 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 20 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        
        animate();

        // 6. Handle Window Resizing (Keeps 3D aspect ratio correct when rotating phone)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
